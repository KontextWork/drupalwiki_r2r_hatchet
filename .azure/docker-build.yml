pool: "Default"

trigger:
  branches:
    include:
      - main
      - stable/*

pr:
  branches:
    include:
      - '*'

variables:
  - group: kw-nexus-reader
  - name: image_name
    value: R2R hatchet
  - name: main_repository_name
    value: 'drupalwiki_r2r_hatchet'
  - name: dockerfile_image_basepath_relative
    value: 'docker/hatchet'

resources:
  repositories:
    - repository: dockerfile_library
      type: github
      name: KontextWork/dockerfile_library
      ref: master
      endpoint: KontextWork
    - repository: azureCommonTemplates
      type: github
      name: KontextWork/azure-common-templates
      ref: master
      endpoint: KontextWork
jobs:
  - job: docker_image
    displayName: Building docker image ${{ variables.image_name }}
    dependsOn: []
    steps:
    - checkout: self
      fetchDepth: 5
    - checkout: dockerfile_library
      fetchDepth: 1
    - template: action/docker/make-build-context.yml@azureCommonTemplates
      parameters:
        main_repository_name: $(main_repository_name)
        dockerfile_basepath_relative: $(dockerfile_image_basepath_relative)
    - template: action/git/find_best_branch_name.yml@azureCommonTemplates
    - template: action/docker/release_image.yml@azureCommonTemplates
      parameters:
        SOURCE_REGISTRY_IMAGE_PATH: 'rag/r2r/hatchet-admin'
        # we use the docker image that has been build using this very tag as the source and promote it.
        # $(Build.SourceVersion) is the git commit has of our tag we triggered on
        SOURCE_TAG: build-commit-$(Build.SourceVersion)
        TARGET_REGISTRY_IMAGE_PATH: 'rag/r2r/hatchet-admin'
        TARGET_TAG: $(releaseVersion)
    - template: action/docker/release_image.yml@azureCommonTemplates
      parameters:
        SOURCE_REGISTRY_IMAGE_PATH: 'rag/r2r/hatchet-dashboard'
        # we use the docker image that has been build using this very tag as the source and promote it.
        # $(Build.SourceVersion) is the git commit has of our tag we triggered on
        SOURCE_TAG: build-commit-$(Build.SourceVersion)
        TARGET_REGISTRY_IMAGE_PATH: 'rag/r2r/hatchet-dashboard'
        TARGET_TAG: $(releaseVersion)
    - template: action/docker/release_image.yml@azureCommonTemplates
      parameters:
        SOURCE_REGISTRY_IMAGE_PATH: 'rag/r2r/hatchet-engine'
        # we use the docker image that has been build using this very tag as the source and promote it.
        # $(Build.SourceVersion) is the git commit has of our tag we triggered on
        SOURCE_TAG: build-commit-$(Build.SourceVersion)
        TARGET_REGISTRY_IMAGE_PATH: 'rag/r2r/hatchet-engine'
        TARGET_TAG: $(releaseVersion)
    - template: action/docker/release_image.yml@azureCommonTemplates
      parameters:
        SOURCE_REGISTRY_IMAGE_PATH: 'rag/r2r/hatchet-migrate'
        # we use the docker image that has been build using this very tag as the source and promote it.
        # $(Build.SourceVersion) is the git commit has of our tag we triggered on
        SOURCE_TAG: build-commit-$(Build.SourceVersion)
        TARGET_REGISTRY_IMAGE_PATH: 'rag/r2r/hatchet-migrate'
        TARGET_TAG: $(releaseVersion)
